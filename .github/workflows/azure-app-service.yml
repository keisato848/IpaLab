name: Azure App Service CI/CD

# ==============================================================
# Azure App Service デプロイワークフロー
# 
# 背景: Azure SWA + Next.js Hybrid での Application Insights 
#       ログ出力問題を解決するため、App Service に移行
# 
# 作成日: 2025/01/XX
# 関連: docs/03_migration/01_SWA_to_AppService_Migration_Plan.md
# ==============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/azure-app-service.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: app-pm-exam-dx-prod
  AZURE_WEBAPP_PACKAGE_PATH: './apps/web/.next/standalone'
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Turbo (standalone mode)
        run: npm run build:standalone
        env:
          # ビルド時に必要な環境変数
          NEXT_PUBLIC_APP_URL: https://app-pm-exam-dx-prod.azurewebsites.net

      - name: Create deployment package
        run: |
          # Next.js standalone ビルドの構造:
          # apps/web/.next/standalone/  - Node.js サーバー
          # apps/web/.next/static/      - CSS/JS 静的ファイル（standalone外）
          # apps/web/public/            - 公開ファイル

          cd apps/web/.next/standalone
          echo "=== Original standalone structure ==="
          ls -la
          ls -la apps/web/ || echo "apps/web directory check"

          # apps/webの内容をルートにコピー（App Serviceが期待する構造）
          cp -r apps/web/* .

          # .next ディレクトリを作成
          mkdir -p .next

          # apps/web/.next 配下のファイルをコピー
          cp -r apps/web/.next/* .next/ 2>/dev/null || true

          # 重要: standalone 外の static ディレクトリをコピー
          # Next.js standalone では static は standalone フォルダ外に出力される
          echo "=== Copying .next/static from parent ==="
          if [ -d "../static" ]; then
            cp -r ../static .next/
            echo "Copied .next/static successfully"
            ls -la .next/static/ | head -20
          else
            echo "WARNING: ../static not found!"
            echo "Checking parent structure:"
            ls -la ../
          fi

          # public ディレクトリをコピー (apps/web/public -> standalone root)
          echo "=== Copying public directory ==="
          if [ -d "../../public" ]; then
            cp -r ../../public .
            echo "Copied public directory"
          else
            echo "No public directory found"
          fi

          # 不要なディレクトリを削除（apps/ のみ。node_modules/ は standalone 実行に必須）
          rm -rf apps 2>/dev/null || true

          echo "=== Final deployment structure ==="
          ls -la
          echo "=== node_modules check (must contain 'next') ==="
          ls node_modules/next/package.json && echo "OK: next module found" || echo "ERROR: next module missing!"
          echo "=== .next directory ==="
          ls -la .next/
          echo "=== .next/static check ==="
          ls -la .next/static/ 2>/dev/null || echo ".next/static not found!"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: apps/web/.next/standalone/
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Azure App Service
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact
          path: ./deploy

      - name: Display structure of downloaded files
        run: |
          echo "=== Deploy directory structure ==="
          ls -la ./deploy
          echo "=== Looking for server.js ==="
          find ./deploy -name "server.js" -type f

      # Service Principal を使用して Azure にログイン（Microsoft推奨方式）
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 起動コマンドを明示的に設定（Oryx デフォルトに依存しない）
      # 背景: Azure Portal / CLI で設定した startup-file はコードデプロイとは独立して管理される。
      #       過去に設定された旧起動コマンド (node --require ./appinsights-preload.js server.js) が
      #       コード変更後も残存し、起動失敗の根本原因となっていた。
      # 参照: docs/04_reports/AppService_Startup_Failure_RootCause_20260207.md
      - name: Configure App Service startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group rg-pm-exam-dx-prod \
            --startup-file "node server.js"

      # Application Insights コードレスエージェント無効化 + Oryx バイパス
      # 背景:
      #   - WEBSITE_RUN_FROM_PACKAGE=1: ZIP パッケージを直接マウントして実行。
      #     Oryx の node_modules.tar.gz 展開を完全にバイパスし、
      #     古い依存関係による上書き問題を根本的に排除する。
      #   - コードレスエージェント無効化: HTTP モンキーパッチによる
      #     Next.js canonicalBase エラーを防止。
      # 参照: docs/04_reports/AppService_Startup_Failure_RootCause_20260207.md
      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group rg-pm-exam-dx-prod \
            --settings \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              ApplicationInsightsAgent_EXTENSION_VERSION=disabled \
              XDT_MicrosoftApplicationInsights_Mode=disabled \
              XDT_MicrosoftApplicationInsights_PreemptSdk=disabled \
              WEBSITES_PORT=8080

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./deploy

      - name: Azure Logout
        run: az logout

  # PR時はビルド成功のみを確認（デプロイはしない）
  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: PR Build Check
    needs: build
    steps:
      - name: Build successful
        run: echo "Build completed successfully for PR"
