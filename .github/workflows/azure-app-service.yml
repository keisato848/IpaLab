name: Azure App Service CI/CD

# ==============================================================
# Azure App Service デプロイワークフロー
# 
# 背景: Azure SWA + Next.js Hybrid での Application Insights 
#       ログ出力問題を解決するため、App Service に移行
# 
# 作成日: 2025/01/XX
# 関連: docs/03_migration/01_SWA_to_AppService_Migration_Plan.md
# ==============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/azure-app-service.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/azure-app-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # gh run download でビルド成果物を取得するために必要
  pull-requests: write  # Staging デプロイ完了後のPRコメント投稿に必要

env:
  AZURE_WEBAPP_NAME: app-pm-exam-dx-prod
  AZURE_WEBAPP_PACKAGE_PATH: './apps/web/.next/standalone'
  NODE_VERSION: '24.x'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx turbo run test:run --filter=web

  build:
    runs-on: ubuntu-latest
    needs: test
    name: Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Turbo (standalone mode)
        run: npm run build:standalone
        env:
          # ビルド時に必要な環境変数
          NEXT_PUBLIC_APP_URL: https://app-pm-exam-dx-prod.azurewebsites.net

      - name: Create deployment package
        run: |
          # Next.js standalone ビルドの構造:
          # apps/web/.next/standalone/  - Node.js サーバー
          # apps/web/.next/static/      - CSS/JS 静的ファイル（standalone外）
          # apps/web/public/            - 公開ファイル

          cd apps/web/.next/standalone
          echo "=== Original standalone structure ==="
          ls -la
          ls -la apps/web/ || echo "apps/web directory check"

          # apps/webの内容をルートにコピー（App Serviceが期待する構造）
          cp -r apps/web/* .

          # .next ディレクトリを作成
          mkdir -p .next

          # apps/web/.next 配下のファイルをコピー
          cp -r apps/web/.next/* .next/ 2>/dev/null || true

          # 重要: standalone 外の static ディレクトリをコピー
          # Next.js standalone では static は standalone フォルダ外に出力される
          echo "=== Copying .next/static from parent ==="
          if [ -d "../static" ]; then
            cp -r ../static .next/
            echo "Copied .next/static successfully"
            ls -la .next/static/ | head -20
          else
            echo "WARNING: ../static not found!"
            echo "Checking parent structure:"
            ls -la ../
          fi

          # public ディレクトリをコピー (apps/web/public -> standalone root)
          echo "=== Copying public directory ==="
          if [ -d "../../public" ]; then
            cp -r ../../public .
            echo "Copied public directory"
          else
            echo "No public directory found"
          fi

          # 不要なディレクトリを削除（apps/ のみ。node_modules/ は standalone 実行に必須）
          rm -rf apps 2>/dev/null || true

          echo "=== Final deployment structure ==="
          ls -la
          echo "=== node_modules check (must contain 'next') ==="
          ls node_modules/next/package.json && echo "OK: next module found" || echo "ERROR: next module missing!"
          echo "=== .next directory ==="
          ls -la .next/
          echo "=== .next/static check ==="
          ls -la .next/static/ 2>/dev/null || echo ".next/static not found!"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: webapp-artifact
          path: apps/web/.next/standalone/
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Azure App Service
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download artifact from build job
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name webapp-artifact --dir ./deploy

      - name: Display structure of downloaded files
        run: |
          echo "=== Deploy directory structure ==="
          ls -la ./deploy
          echo "=== Looking for server.js ==="
          find ./deploy -name "server.js" -type f

      # Service Principal を使用して Azure にログイン（Microsoft推奨方式）
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 起動コマンドを明示的に設定（Oryx デフォルトに依存しない）
      # 背景: Azure Portal / CLI で設定した startup-file はコードデプロイとは独立して管理される。
      #       過去に設定された旧起動コマンド (node --require ./appinsights-preload.js server.js) が
      #       コード変更後も残存し、起動失敗の根本原因となっていた。
      # 参照: docs/04_reports/AppService_Startup_Failure_RootCause_20260207.md
      - name: Configure App Service startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group rg-pm-exam-dx-prod \
            --startup-file "node server.js"

      # IPA コードレスエージェント無効化
      # Linux App Service の IPA は APPLICATIONINSIGHTS_* / APPINSIGHTS_* プレフィックスや
      # *_EXTENSION_VERSION / XDT_* 設定の「存在」を検出して自動有効化し、
      # 手動 SDK の OpenTelemetry セットアップと競合する。
      # 対策: IPA トリガーとなる全設定を削除し、IPA が認識しないカスタム名
      # TELEMETRY_CONNECTION_STRING で接続文字列を渡す。
      - name: Disable IPA codeless agent (remove trigger env vars)
        run: |
          az webapp config appsettings delete \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group rg-pm-exam-dx-prod \
            --setting-names \
              APPLICATIONINSIGHTS_CONNECTION_STRING \
              APPINSIGHTS_CONNECTIONSTRING \
              APPINSIGHTS_INSTRUMENTATIONKEY \
              APPINSIGHTS_CS \
              APPINSIGHTS_PROFILERFEATURE_VERSION \
              APPINSIGHTS_SNAPSHOTFEATURE_VERSION \
              ApplicationInsightsAgent_EXTENSION_VERSION \
              DiagnosticServices_EXTENSION_VERSION \
              InstrumentationEngine_EXTENSION_VERSION \
              SnapshotDebugger_EXTENSION_VERSION \
              XDT_MicrosoftApplicationInsights_Mode \
              XDT_MicrosoftApplicationInsights_PreemptSdk \
              XDT_MicrosoftApplicationInsights_BaseExtensions \
            2>/dev/null || echo "Settings already removed or not found"

      # App Service 設定: Oryx バイパス + ポート + テレメトリ接続文字列
      - name: Configure App Service settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group rg-pm-exam-dx-prod \
            --settings \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              WEBSITES_PORT=8080 \
              TELEMETRY_CONNECTION_STRING="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}"

      - name: Deploy to Azure Web App
        run: |
          rm -f deploy.zip
          (cd deploy && zip -qr ../deploy.zip .)
          ls -lh deploy.zip
          az webapp deploy \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group rg-pm-exam-dx-prod \
            --src-path deploy.zip \
            --type zip

      # VNet 統合の維持確認 (CosmosDB ゼロトラスト保護)
      # コードデプロイでは VNet 統合設定は影響を受けないが、念のため確認
      - name: Verify VNet integration
        run: |
          VNET_SUBNET=$(az webapp show \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group rg-pm-exam-dx-prod \
            --query virtualNetworkSubnetId -o tsv 2>/dev/null)
          if [ -n "$VNET_SUBNET" ] && [ "$VNET_SUBNET" != "null" ]; then
            echo "✅ VNet integration active: $VNET_SUBNET"
          else
            echo "⚠️ WARNING: VNet integration not detected. CosmosDB 接続に影響の可能性あり"
            echo "Run: az webapp vnet-integration add --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group rg-pm-exam-dx-prod --vnet vnet-pm-exam-dx-ea --subnet snet-appservice"
          fi

      - name: Azure Logout
        run: az logout

  # PR時にStagingへ自動デプロイして動作確認を可能にする
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Staging
    if: github.event_name == 'pull_request'
    env:
      # job レベルで env に展開することで、steps の if 条件から空チェックが可能
      STAGING_APP_NAME: ${{ secrets.AZURE_STAGING_WEBAPP_NAME }}
      STAGING_RG: rg-pm-exam-dx-staging

    steps:
      # Staging シークレットが設定済みか確認（未設定時は後続の Azure ステップをスキップ）
      # Phase 1-2（Azure リソース作成・GitHub Secrets 登録）完了後に自動で有効化される
      - name: Check staging secrets
        id: config-check
        run: |
          if [ -z "$STAGING_APP_NAME" ]; then
            echo "::notice::AZURE_STAGING_WEBAPP_NAME が未設定のため Staging デプロイをスキップします。"
            echo "::notice::docs/03_plans/staging-environment-setup.md の Phase 1-2 を完了後に自動有効化されます。"
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact from build job
        if: steps.config-check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name webapp-artifact --dir ./deploy

      - name: Display deploy structure
        if: steps.config-check.outputs.configured == 'true'
        run: |
          echo "=== Deploy directory ==="
          ls -la ./deploy
          find ./deploy -name "server.js" -type f

      # 本番と同じ Service Principal を使用してログイン
      - name: Azure Login
        if: steps.config-check.outputs.configured == 'true'
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 起動コマンドを明示的に設定
      - name: Configure Staging startup command
        if: steps.config-check.outputs.configured == 'true'
        run: |
          az webapp config set \
            --name "$STAGING_APP_NAME" \
            --resource-group "$STAGING_RG" \
            --startup-file "node server.js"

      # Staging 環境: IPA コードレスエージェント無効化
      - name: Disable IPA codeless agent on Staging
        if: steps.config-check.outputs.configured == 'true'
        run: |
          az webapp config appsettings delete \
            --name "$STAGING_APP_NAME" \
            --resource-group "$STAGING_RG" \
            --setting-names \
              APPLICATIONINSIGHTS_CONNECTION_STRING \
              APPINSIGHTS_CONNECTIONSTRING \
              APPINSIGHTS_INSTRUMENTATIONKEY \
              APPINSIGHTS_CS \
              ApplicationInsightsAgent_EXTENSION_VERSION \
              DiagnosticServices_EXTENSION_VERSION \
              InstrumentationEngine_EXTENSION_VERSION \
              SnapshotDebugger_EXTENSION_VERSION \
              XDT_MicrosoftApplicationInsights_Mode \
              XDT_MicrosoftApplicationInsights_PreemptSdk \
              XDT_MicrosoftApplicationInsights_BaseExtensions \
            2>/dev/null || echo "Settings already removed or not found"

      # Staging 固有の App Service 設定
      # COSMOS_DB_CONNECTION, AUTH_SECRET は Staging 専用シークレットを使用
      # AUTH_TRUST_HOST=true で NextAuth がホスト名を自動検出（NEXTAUTH_URL 不要）
      - name: Configure Staging App Service settings
        if: steps.config-check.outputs.configured == 'true'
        run: |
          az webapp config appsettings set \
            --name "$STAGING_APP_NAME" \
            --resource-group "$STAGING_RG" \
            --settings \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              WEBSITES_PORT=8080 \
              AUTH_TRUST_HOST="true" \
              AUTH_SECRET="${{ secrets.NEXTAUTH_SECRET_STAGING }}" \
              AUTH_GITHUB_ID="${{ secrets.AUTH_GITHUB_ID }}" \
              AUTH_GITHUB_SECRET="${{ secrets.AUTH_GITHUB_SECRET }}" \
              AUTH_GOOGLE_ID="${{ secrets.AUTH_GOOGLE_ID }}" \
              AUTH_GOOGLE_SECRET="${{ secrets.AUTH_GOOGLE_SECRET }}" \
              COSMOS_DB_CONNECTION="${{ secrets.COSMOS_DB_CONNECTION }}" \
              TELEMETRY_CONNECTION_STRING="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
              STAGING_BYPASS_TOKEN="${{ secrets.STAGING_BYPASS_TOKEN }}" \
              STAGING_BYPASS_TARGET_GITHUB_ACCOUNT_ID="${{ secrets.STAGING_BYPASS_TARGET_GITHUB_ACCOUNT_ID }}"

      - name: Deploy to Staging Web App
        if: steps.config-check.outputs.configured == 'true'
        run: |
          rm -f deploy.zip
          (cd deploy && zip -qr ../deploy.zip .)
          ls -lh deploy.zip
          az webapp deploy \
            --name "$STAGING_APP_NAME" \
            --resource-group "$STAGING_RG" \
            --src-path deploy.zip \
            --type zip

      - name: Azure Logout
        if: steps.config-check.outputs.configured == 'true'
        run: az logout

      # デプロイ完了後、PRにStagingのURLをコメント投稿（既存コメントは更新）
      # secrets は github-script 内で直接展開できないため、env 経由で渡す
      - name: Comment PR with Staging URL
        if: steps.config-check.outputs.configured == 'true'
        uses: actions/github-script@v8
        env:
          STAGING_APP_NAME: ${{ env.STAGING_APP_NAME }}
        with:
          script: |
            const appName = process.env.STAGING_APP_NAME;
            const stagingUrl = `https://${appName}.azurewebsites.net`;
            const sha7 = '${{ github.sha }}'.substring(0, 7);
            const branch = '${{ github.head_ref }}';
            const body = [
              '## ✅ Staging デプロイ完了',
              '',
              '| 項目 | 値 |',
              '|------|-----|',
              `| 🌐 Staging URL | [Stagingで確認する](${stagingUrl}) |`,
              `| 🌿 ブランチ | \`${branch}\` |`,
              `| 📝 コミット | \`${sha7}\` |`,
              '',
              '> ⚠️ 複数PRが同時進行している場合は**最後にデプロイされたPR**が反映されています。',
              '> 確認後は本PRのレビューを進めてください。',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // 既存のStagingデプロイコメントを検索して更新（重複防止）
            const existingComment = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Staging デプロイ完了')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              console.log('Updated existing Staging comment:', existingComment.id);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new Staging comment');
            }
