name: ipalab-local-cosmos

services:
  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: ["--protocol", "https"]
    environment:
      ENABLE_TELEMETRY: "false"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "1234:1234"
    volumes:
      - cosmosdb-data:/data

volumes:
  cosmosdb-data:
